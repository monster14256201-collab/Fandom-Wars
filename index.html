<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fandom Wars & Pixel Arena</title>
    <style>
        :root {
            --team-a: #ef4444;
            --team-b: #3b82f6;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Dil Seçici Üst Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .lang-select {
            padding: 6px 10px;
            border-radius: 6px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            font-weight: bold;
            cursor: pointer;
        }

        .header-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .match-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .bar-container {
            height: 25px;
            background: #334155;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            margin: 10px 0;
        }

        .bar-a {
            background: var(--team-a);
            width: 50%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10px;
            font-weight: bold;
        }

        .bar-b {
            background: var(--team-b);
            width: 50%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-weight: bold;
        }

        .versus-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .team-box {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .team-box.a { border: 2px solid var(--team-a); }
        .team-box.b { border: 2px solid var(--team-b); }

        .btn-heart {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            font-size: 0.9rem;
            transition: transform 0.1s;
        }

        .btn-heart:active { transform: scale(0.95); }
        .btn-a { background: var(--team-a); color: white; }
        .btn-b { background: var(--team-b); color: white; }

        .pixel-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        canvas {
            background: #ffffff;
            border-radius: 6px;
            cursor: crosshair;
            touch-action: none;
            max-width: 100%;
        }

        .chat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
        }

        .chat-box {
            height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            background: #334155;
        }

        .msg.team-a-msg { border-left: 4px solid var(--team-a); }
        .msg.team-b-msg { border-left: 4px solid var(--team-b); }

        .input-group {
            display: flex;
            gap: 5px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
        }

        .btn-send {
            padding: 0 15px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Üst Bar -->
        <div class="top-bar">
            <h2>Fandom Wars</h2>
            <select class="lang-select">
                <option value="tr">Türkçe</option>
                <option value="en">English</option>
            </select>
        </div>

        <!-- Oy Sayım Barı -->
        <div class="header-card">
            <div class="match-title">Anlık Fandom Mücadelesi</div>
            <div class="bar-container">
                <div class="bar-a" id="barA">Kırmızı: 50%</div>
                <div class="bar-b" id="barB">Mavi: 50%</div>
            </div>
            <div class="versus-grid">
                <div class="team-box a">
                    <h3>Kırmızı Takım</h3>
                    <button class="btn-heart btn-a" onclick="vote('a')">Oy Ver ❤️</button>
                </div>
                <div class="team-box b">
                    <h3>Mavi Takım</h3>
                    <button class="btn-heart btn-b" onclick="vote('b')">Oy Ver ❤️</button>
                </div>
            </div>
        </div>

        <!-- Piksel Alanı (Canvas) -->
        <div class="pixel-card">
            <h3>Pixel Sanat Alanı</h3>
            <canvas id="pixelCanvas" width="300" height="150"></canvas>
        </div>

        <!-- Sohbet Alanı -->
        <div class="chat-card">
            <h3>Fandom Sohbeti</h3>
            <div class="chat-box" id="chatBox">
                <div class="msg team-a-msg">Kırmızı Takım: Buradayız!</div>
                <div class="msg team-b-msg">Mavi Takım: Alacağız bu maçı!</div>
            </div>
            <div class="input-group">
                <input type="text" id="msgInput" placeholder="Mesaj yaz...">
                <button class="btn-send" onclick="sendMsg()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        let votesA = 50;
        let votesB = 50;

        function vote(team) {
            if(team === 'a') {
                votesA += 2;
                votesB -= 2;
            } else {
                votesB += 2;
                votesA -= 2;
            }
            if(votesA > 98) votesA = 98;
            if(votesA < 2) votesA = 2;
            votesB = 100 - votesA;

            document.getElementById('barA').style.width = votesA + '%';
            document.getElementById('barA').innerText = 'Kırmızı: ' + votesA + '%';
            document.getElementById('barB').style.width = votesB + '%';
            document.getElementById('barB').innerText = 'Mavi: ' + votesB + '%';
        }

        function sendMsg() {
            let input = document.getElementById('msgInput');
            if(input.value.trim() === '') return;
            let chatBox = document.getElementById('chatBox');
            let newMsg = document.createElement('div');
            newMsg.className = 'msg';
            newMsg.innerText = input.value;
            chatBox.appendChild(newMsg);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Basit Canvas Çizim Mantığı
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / 10) * 10;
            const y = Math.floor((e.clientY - rect.top) / 10) * 10;
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(x, y, 10, 10);
        });
    </script>
</body>
</html>
